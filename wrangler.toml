name = "d1-worker"
account_id = "profile"
main = "src/index.js"
compatibility_date = "2024-03-26"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "hoox-trading-db"
database_id = "YOUR_DATABASE_ID_HERE" # Make sure to replace this placeholder

# Secrets managed via Cloudflare Secrets Store
secrets_store_secrets = [
  { binding = "INTERNAL_SERVICE_KEY_SECRET", store_id = "<YOUR_STORE_ID>", secret_name = "D1_INTERNAL_SERVICE_KEY" }
]

# Remove old comments
# # Secrets to be added with wrangler:
# # wrangler secret put INTERNAL_SERVICE_KEY 