name = "d1-worker"
account_id = "profile"
main = "src/index.ts"
compatibility_date = "2024-03-26"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "hoox-trading-db"
database_id = "YOUR_DATABASE_ID_HERE" # Make sure to replace this placeholder

# Secrets managed via Cloudflare Secrets Store
secrets_store_secrets = [] # Or remove the whole key if no other secrets

# Remove old comments
# # Secrets to be added with wrangler:
# # wrangler secret put INTERNAL_SERVICE_KEY 